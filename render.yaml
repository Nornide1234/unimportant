databases:
  - name: keyserver-db
    plan: free
    databaseName: keyserver
    user: keyserver

services:
  - type: web
    name: keyserver
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: keyserver-db
          property: connectionString
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
